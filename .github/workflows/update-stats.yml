name: Update Profile SVGs
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_svgs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMESTAMP=$(date +%s)
          sed -i -E "s#(assets/(commits|tools)\.svg)(\?[a-zA-Z0-9_=]+)?#\1?t=${TIMESTAMP}#g" README.md
          git add assets/commits.svg assets/tools.svg README.md
          git commit -m "Update profile charts" || exit 0
          git push
