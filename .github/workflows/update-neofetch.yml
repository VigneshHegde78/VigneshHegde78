mkdir -p .github/workflows
cat << 'EOF' > .github/workflows/update-neofetch.yml
name: Update Neofetch Profile SVG

on:
  schedule:
    # Runs once daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ascii.txt'
      - 'generate_neofetch.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Neofetch SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python generate_neofetch.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg
          git diff --staged --quiet || git commit -m "chore: update neofetch stats SVG"
          git push
EOF
